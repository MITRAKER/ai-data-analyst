# Docker Compose runs the whole app with one command. From the repository root:
#
#   docker compose up --build
#
# Then open http://localhost:3000. Stop it with Ctrl+C, or with
# `docker compose down` (add --volumes to delete the uploaded data too).
#
# Two services work together:
# - "web" is the web UI. It is the only one you can open, and only from this
#   computer (127.0.0.1).
# - "api" is the Python API with the agent. It publishes no port at all: only
#   "web" can reach it, over the private network that Compose creates.
#
# The agent needs your Claude API key. Compose takes ANTHROPIC_API_KEY from
# your shell, or from a .env file next to this file (copy .env.example to
# .env), and gives it to "api" when the container starts. The key never goes
# into an image.

name: ai-data-analyst

services:
  api:
    build: ./backend
    environment:
      # ":-" means "empty if not set". Without a key the app still starts; the
      # page then says that the agent can't answer yet.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      AGENT_EFFORT: ${AGENT_EFFORT:-}
      # Keep the uploaded data in the "data" volume, so it survives a restart.
      DUCKDB_PATH: /data/analyst.duckdb
    volumes:
      - data:/data
    # Defense in depth, as in the Python sandbox: the container can't change
    # any file of its image. It may write only to /data and to /tmp, which
    # lives in memory and holds uploads and the sandbox's files while they run.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    # No Linux capabilities, and no way to gain more rights later.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
    ports:
      # Only this computer can open the app. Set WEB_PORT to use another port
      # than 3000; an empty WEB_PORT picks a free one (the smoke test does that).
      - 127.0.0.1:${WEB_PORT-3000}:3000
    # Start the web UI once the API's health check passes.
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  data:
