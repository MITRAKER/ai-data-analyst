# CI ("continuous integration") checks every change automatically. It runs on
# every pull request and on every push to main. Each job below is one check, and
# each runs on a fresh virtual machine ("runner") that GitHub provides. Merge a
# pull request only when every check is green.
#
# Most jobs run a `make` or `npm run` command, so you can run exactly the same
# check on your own computer before you push. LEARNING.md explains every job:
# Lesson 3 the backend's, Lesson 4 the web UI's.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Once a week, so that a newly published vulnerability in one of our
  # dependencies is found even when nobody pushes. Mondays at 05:17 UTC.
  schedule:
    - cron: "17 5 * * 1"
  # The release workflow runs all of CI again on the commit it releases.
  workflow_call:
  # Adds a "Run workflow" button in the Actions tab, to start CI by hand.
  workflow_dispatch:

# Least privilege: the jobs may read the code and nothing else.
permissions:
  contents: read

# A new push to a pull request cancels the CI run that is still going for the
# old commit. Every other run gets a group of its own, so it is never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # bash with -e (stop at the first command that fails) and -o pipefail (a
    # pipe fails when any command in it fails, not only the last one).
    shell: bash

env:
  # Every uv command must use the exact versions in backend/uv.lock. If uv.lock
  # does not match pyproject.toml, uv stops with an error.
  UV_LOCKED: "1"
  # uv must use the Python that setup-python installed, never download another.
  UV_PYTHON_DOWNLOADS: never
  # Show Ruff's findings as notes on the changed lines of a pull request.
  RUFF_OUTPUT_FORMAT: github

jobs:
  lint:
    name: Lint and format (Ruff)
    runs-on: ubuntu-latest
    # Stop a job that hangs, instead of using up CI minutes.
    timeout-minutes: 10
    steps:
      # persist-credentials: false means the job's access token is not saved
      # inside the checked-out folder, where later steps could read it.
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python, uv and the dependencies
        uses: $/.github/actions/setup-backend
      - name: Run Ruff
        run: make lint

  typecheck:
    name: Types (mypy and basedpyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python, uv and the dependencies
        uses: $/.github/actions/setup-backend
      - name: Run mypy and basedpyright
        run: make typecheck

  jpl:
    name: NASA/JPL Power of Ten
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python, uv and the dependencies
        uses: $/.github/actions/setup-backend
      - name: Run the Power of Ten checker
        run: make jpl

  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Finish the tests on every Python version, even after one has failed.
      fail-fast: false
      matrix:
        # Every version we support, from the oldest (requires-python in
        # pyproject.toml) to the newest, which the Docker image uses. The
        # sandbox relies on how Python works inside, and that changes between
        # versions, so each one gets the full test run.
        python: ["3.12", "3.13", "3.14", "3.15"]
    env:
      # Every uv command in this job uses this Python version, instead of the
      # one in backend/.python-version.
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python, uv and the dependencies
        uses: $/.github/actions/setup-backend
        with:
          python-version: ${{ matrix.python }}
      - name: Run the tests (fails below 95% branch coverage)
        run: make test
      # The coverage table appears on the summary page of the run. It runs even
      # when the tests failed, but not when the run was cancelled.
      - name: Add the coverage table to the run summary
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          {
            echo "### Test coverage on Python $PYTHON_VERSION"
            uv run coverage report --format=markdown --fail-under=0
          } >> "$GITHUB_STEP_SUMMARY"

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python, uv and the dependencies
        uses: $/.github/actions/setup-backend
      - name: Look for known vulnerabilities in the locked dependencies
        run: make security

  hygiene:
    name: Files, secrets, scripts and workflows (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python, uv and the dependencies
        uses: $/.github/actions/setup-backend
      # The same hooks that run before each commit, on every file. The Python
      # and web UI hooks are skipped because other jobs run those tools already.
      # no-commit-to-branch is skipped because CI also checks main itself.
      - name: Run the pre-commit hooks on every file
        env:
          SKIP: no-commit-to-branch,ruff-check,ruff-format,mypy,basedpyright,power-of-ten,web-format,web-lint
        run: uv run --project backend pre-commit run --all-files --show-diff-on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build the image
        run: make docker
      - name: Start the image and use the app
        run: make smoke

  # ---- The web UI (frontend/) ----

  web:
    name: Web UI (format, lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The Node.js version in frontend/.nvmrc. No cache: every run installs
      # from the registry, so a bad cache from another run can't get in.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      # npm ci installs exactly what package-lock.json lists, and stops with an
      # error if package-lock.json does not match package.json.
      - name: Install the packages
        run: npm ci
      - name: Check the formatting (Prettier)
        run: npm run format:check
      - name: Lint (ESLint, with the Power of Ten rules)
        run: npm run lint
      - name: Check the types (TypeScript)
        run: npm run typecheck
      - name: Run the tests (fails below 95% coverage)
        run: npm run test:coverage
      - name: Build the app
        run: npm run build
      # Known vulnerabilities in the locked packages, and the registry's
      # signatures, which show that each package is the one npm published.
      - name: Look for known vulnerabilities in the locked packages
        run: npm audit
      - name: Check the signatures of the installed packages
        run: npm audit signatures

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          package-manager-cache: false
      - name: Install the packages
        run: npm ci
      # The Chromium build that this Playwright version expects, and the
      # system libraries it needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build the app
        run: npm run build
      - name: Run the browser tests
        run: npm run test:e2e
      # After a failure, the report (with a screenshot of each failed test) can
      # be downloaded from the run's summary page for a week.
      - name: Keep the report of a failed run
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  compose:
    name: Docker Compose (web UI and API together)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start both services, and use the app
        run: make compose-smoke

  # One check that sums up all the others. In the branch protection settings,
  # make this the single required check, instead of listing every job there.
  all-passed:
    name: All checks passed
    # Run even when a job above failed, so this check fails instead of being
    # skipped (GitHub treats a skipped required check as passed).
    if: ${{ always() }}
    needs: [lint, typecheck, jpl, test, audit, hygiene, docker, web, e2e, compose]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::At least one check did not pass."
              exit 1
            fi
          done
