# Publishes a release when a version tag is pushed. CONTRIBUTING.md
# ("Releasing a version") has the steps. In short:
#   git tag -a v0.2.0 -m "v0.2.0"
#   git push origin v0.2.0
#
# The workflow:
#   1. checks that the tag matches __version__ in backend/app/__init__.py and
#      that CHANGELOG.md has a section for that version,
#   2. runs all of CI again on the tagged commit,
#   3. creates a GitHub Release, with that CHANGELOG section as its notes, and
#   4. builds the Docker image for Intel/AMD and ARM computers and pushes it to
#      the GitHub Container Registry, as ghcr.io/<owner>/<repository>.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Least privilege: the jobs may read the code. The two jobs that publish
# something ask for more below.
permissions:
  contents: read

# Never run two releases of the same tag at once, and never cancel one halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Compare the tag with the code and the changelog
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          in_code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' backend/app/__init__.py)"
          if [ "$version" != "$in_code" ]; then
            echo "::error::The tag is $TAG, but backend/app/__init__.py says __version__ = \"$in_code\"."
            exit 1
          fi
          # Fails when CHANGELOG.md has no notes for this version.
          scripts/release-notes.sh "$version" > /dev/null
          # PEP 440 pre-releases end in aN, bN, rcN or .devN, as in 1.0.0rc1.
          if [[ "$version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: check
    uses: $/.github/workflows/ci.yml

  github-release:
    name: GitHub Release
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Write the release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: scripts/release-notes.sh "$VERSION" > release-notes.md
      # gh is GitHub's command-line tool. It is already installed on the runner.
      #   --verify-tag  stop if the tag does not exist on GitHub
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--verify-tag --title "$TAG" --notes-file release-notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "${flags[@]}"

  image:
    name: Docker image
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push the image to ghcr.io
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The runner is an Intel/AMD (x86-64) machine. QEMU emulates an ARM CPU,
      # so the same machine can also build the image for ARM computers, such
      # as Macs with Apple silicon. tonistiigi/binfmt is Docker's own installer
      # for it.
      - name: Set up QEMU to build for ARM
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install arm64
      # The default builder can only build for the machine it runs on. A
      # "docker-container" builder can build for several platforms at once.
      - name: Set up a builder for several platforms
        run: docker buildx create --name multi-platform --driver docker-container --use
      # The job's own short-lived token logs in. --password-stdin keeps the
      # token out of the command line, where other processes could see it.
      - name: Log in to the GitHub Container Registry
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      # Tags: the version (0.2.0), and "latest" unless this is a pre-release.
      # Registry names must be lowercase; ${GITHUB_REPOSITORY,,} lowercases it.
      #   --provenance mode=max  attach a record of how the image was built (its "provenance")
      #   --sbom true            attach the list of every package inside the image
      - name: Build and push the image
        env:
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags=(--tag "$image:$VERSION")
          if [ "$PRERELEASE" = "false" ]; then
            tags+=(--tag "$image:latest")
          fi
          docker buildx build backend \
            --platform linux/amd64,linux/arm64 \
            "${tags[@]}" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --provenance mode=max \
            --sbom true \
            --push
