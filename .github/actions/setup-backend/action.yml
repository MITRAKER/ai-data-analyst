# A "composite action": a few steps that several CI jobs share, written once
# instead of copied into every job. A job checks out the code, then uses it:
#   - uses: $/.github/actions/setup-backend
#     with:
#       python-version: "3.12"   # optional; the default is backend/.python-version
#
# "$/" means "this repository, at the commit that is running". uv picks the
# Python version from backend/.python-version too, unless the job sets
# UV_PYTHON (the test job does, once for each Python version it tests).
name: Set up the backend
description: Install Python, uv, and the exact version of every dependency in backend/uv.lock.

inputs:
  python-version:
    description: The Python version to install. Empty means the one in backend/.python-version.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Give setup-python either the version or the file, never both: with both,
    # it uses the version and prints a warning.
    - name: Install Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        python-version-file: ${{ inputs.python-version == '' && 'backend/.python-version' || '' }}

    # The same uv version as backend/Dockerfile: change both together.
    - name: Install uv
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-cache-dir uv==0.13.8

    # --locked: stop with an error if uv.lock does not match pyproject.toml.
    # --all-groups: the developer tools too (pytest, ruff, mypy and so on).
    - name: Install the dependencies from uv.lock
      shell: bash
      working-directory: backend
      run: uv sync --locked --all-groups
